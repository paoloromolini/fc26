{% load static league_tags %}<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FC26 Lega LAN</title>
<link rel="icon" href="{% static 'league/logo.png' %}">
<meta name="theme-color" content="#0b1020">
<link rel="stylesheet" href="{% static 'league/style.css' %}">
</head>
<body>
<header><a href="{% url 'home' %}" class="brand"><img src="{% static 'league/logo.png' %}" alt="FC 2026 Lega LAN Italia"></a></header>
<nav>{% with u=request.resolver_match.url_name %}
  <a href="{% url 'home' %}"{% if u == 'home' %} class="active"{% endif %}>🏆 Classifica</a>
  <a href="{% url 'points' %}"{% if u == 'points' %} class="active"{% endif %}>Punti</a>
  <a href="{% url 'trend' %}"{% if u == 'trend' %} class="active"{% endif %}>Andamento</a>
  <a href="{% url 'pairs' %}"{% if u == 'pairs' %} class="active"{% endif %}>Coppie</a>
  <a href="{% url 'rivalry' %}"{% if u == 'rivalry' %} class="active"{% endif %}>🆚 Rivalità</a>
  <a href="{% url 'matches' %}"{% if u == 'matches' %} class="active"{% endif %}>Partite</a>
  <a href="{% url 'players' %}"{% if u == 'players' %} class="active"{% endif %}>Giocatori</a>
  <a href="{% url 'match_new' %}" class="cta">+ Nuova partita</a>
{% endwith %}</nav>
<main>
  {% for m in messages %}<div class="msg {{ m.tags }}">{{ m }}</div>{% endfor %}
  {% block content %}{% endblock %}
</main>
<dialog id="confirm-dialog">
  <p id="confirm-text"></p>
  <div class="actions">
    <button type="button" class="secondary" id="confirm-no">Annulla</button>
    <button type="button" class="danger" id="confirm-yes">Elimina</button>
  </div>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('confirm-dialog'), pending = null;
  document.addEventListener('submit', function (e) {
    var msg = e.target.getAttribute && e.target.getAttribute('data-confirm');
    if (!msg) return;
    e.preventDefault();
    pending = e.target;
    document.getElementById('confirm-text').textContent = msg;
    dlg.showModal();
  });
  document.getElementById('confirm-yes').onclick = function () { dlg.close(); if (pending) pending.submit(); };
  document.getElementById('confirm-no').onclick = function () { pending = null; dlg.close(); };
  dlg.addEventListener('cancel', function () { pending = null; });
})();
</script>
<script>
document.querySelectorAll('table.sortable').forEach(function (table) {
  var heads = Array.prototype.slice.call(table.querySelectorAll('th'));
  var tbody = heads[0].closest('tbody') || table;
  function key(td, numeric) {
    var t = td.dataset.sort !== undefined ? td.dataset.sort : td.textContent;
    if (numeric) { var m = t.replace('\u2212', '-').replace(',', '.').match(/-?\d+(?:\.\d+)?/); return m ? parseFloat(m[0]) : null; }
    return t.replace(/^[^\p{L}\p{N}]+/u, '').trim().toLowerCase();
  }
  function sort(th, i) {
    var rows = Array.prototype.filter.call(table.rows, function (r) { return r.cells.length === heads.length && !r.querySelector('th'); });
    var numeric = rows.every(function (r) { return key(r.cells[i], true) !== null || /^\s*[–-]\s*$/.test(r.cells[i].textContent); });
    var dir = th.getAttribute('aria-sort') === (numeric ? 'descending' : 'ascending') ? -1 : 1;
    if (numeric) dir = -dir;
    heads.forEach(function (h) { h.removeAttribute('aria-sort'); });
    th.setAttribute('aria-sort', dir === 1 ? 'ascending' : 'descending');
    rows.map(function (r, n) { return {r: r, k: key(r.cells[i], numeric), n: n}; }).sort(function (a, b) {
      if (a.k === null || b.k === null) return a.k === b.k ? a.n - b.n : (a.k === null ? 1 : -1);
      var c = numeric ? a.k - b.k : a.k.localeCompare(b.k, 'it');
      return c ? c * dir : a.n - b.n;
    }).forEach(function (x) { tbody.appendChild(x.r); });
  }
  heads.forEach(function (th, i) {
    if (!th.textContent.trim()) return;
    th.tabIndex = 0;
    th.onclick = function () { sort(th, i); };
    th.onkeydown = function (e) { if (e.key === 'Enter') sort(th, i); };
  });
});
</script>
</body>
</html>
